name: CI

on:
  push:
  pull_request:

jobs:
  forbidden-calls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nessuna shell né eval nel codice
        run: |
          if grep -rnE 'os\.system|shell=True|eval\(' src/; then
            echo "Trovate chiamate vietate (os.system / shell=True / eval)"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installa ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Installa ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Installa ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Installa suiteAV
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
